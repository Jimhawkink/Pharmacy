<svg viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foilGradLg" x1="30" y1="20" x2="130" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="35%" stopColor="#CBD5E1" />
      <stop offset="70%" stopColor="#94A3B8" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <linearGradient id="bubbleLg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#64748B" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="112" height="76" rx="8" fill="#000000" fillOpacity="0.2" />
  <rect x="20" y="20" width="120" height="76" rx="8" fill="url(#foilGradLg)" stroke="#94A3B8" strokeWidth="1.5" />
  <line x1="20" y1="58" x2="140" y2="58" stroke="#64748B" strokeWidth="1" strokeDasharray="3 3" />
  <line x1="50" y1="20" x2="50" y2="96" stroke="#64748B" strokeWidth="1" strokeDasharray="3 3" />
  <line x1="80" y1="20" x2="80" y2="96" stroke="#64748B" strokeWidth="1" strokeDasharray="3 3" />
  <line x1="110" y1="20" x2="110" y2="96" stroke="#64748B" strokeWidth="1" strokeDasharray="3 3" />
  {[35, 65, 95, 125].map((cx, i) => (
    <g key={i}>
      <ellipse cx={cx} cy={39} rx="10" ry="9" fill="url(#bubbleLg)" stroke="#475569" strokeWidth="1" />
      <ellipse cx={cx - 2} cy={36} rx="4" ry="2.5" fill="white" fillOpacity="0.8" />
      <ellipse cx={cx} cy={77} rx="10" ry="9" fill="url(#bubbleLg)" stroke="#475569" strokeWidth="1" />
      <ellipse cx={cx - 2} cy={74} rx="4" ry="2.5" fill="white" fillOpacity="0.8" />
    </g>
  ))}
