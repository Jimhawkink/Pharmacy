<svg viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capRed" x1="30" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF4B4B" />
      <stop offset="55%" stopColor="#DC2626" />
      <stop offset="100%" stopColor="#991B1B" />
    </linearGradient>
    <linearGradient id="capWhite" x1="75" y1="20" x2="130" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="65%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>
    <linearGradient id="capGloss" x1="30" y1="25" x2="130" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="white" stopOpacity="0.85" />
      <stop offset="60%" stopColor="white" stopOpacity="0.35" />
      <stop offset="100%" stopColor="white" stopOpacity="0.05" />
    </linearGradient>
    <filter id="softShadow" x="15" y="75" width="130" height="35" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <!-- Drop Shadow -->
  <ellipse cx="80" cy="92" rx="55" ry="12" fill="#022C22" fillOpacity="0.22" filter="url(#softShadow)" />
  <!-- Capsule Group (rotated -22 deg) -->
  <g transform="rotate(-22 80 55)">
    <!-- Red Left Half -->
    <path d="M42 36C32 36 24 44 24 54C24 64 32 72 42 72H80V36H42Z" fill="url(#capRed)" />
    <!-- White Right Half -->
    <path d="M80 36H118C128 36 136 44 136 54C136 64 128 72 118 72H80V36Z" fill="url(#capWhite)" />
    <!-- Capsule Seam -->
    <line x1="80" y1="35" x2="80" y2="73" stroke="#71717A" strokeWidth="1.2" strokeOpacity="0.35" />
    <!-- Specular Gloss Highlight -->
    <path d="M38 41C31 41 29 45 29 48C29 46 34 42 45 42H115C126 42 131 46 131 48C131 45 129 41 122 41H38Z" fill="url(#capGloss)" />
  </g>
</svg>
